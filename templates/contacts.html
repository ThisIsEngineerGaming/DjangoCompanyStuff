{% extends 'base.html' %}

{% block title %}Contacts{% endblock %}

{% block content %}
<h1 class="page-title">Contacts</h1>

<section class="cards">
    {% for office in offices %}
    <div class="card">
        <h2>📍 {{ office.city }}</h2>
        <p>{{ office.address }}</p>
        <p>☎ {{ office.phone }}</p>
        <p>✉ {{ office.email }}</p>
    </div>
    {% endfor %}
</section>
{% endblock %}
