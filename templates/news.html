{% extends 'base.html' %}

{% block title %}News{% endblock %}

{% block content %}
<h1 class="page-title">Company News</h1>

{% for item in news %}
<article class="news-item">
    <time>{{ item.date }}</time>
    <h2>{{ item.title }}</h2>
    <p>{{ item.text }}</p>
</article>
{% empty %}
<p>No news yet.</p>
{% endfor %}
{% endblock %}
